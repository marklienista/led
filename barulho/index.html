<!DOCTYPE html>

<style>
:root{--quiet:#15803d;--talk:#ca8a04;--loud:#b91c1c;--listen:#2563eb;--ink:#0f172a;--line:#dbe4ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}body{min-height:100vh;background:#eef2f7}.screen{min-height:100vh}
.setup,.summary{display:grid;place-items:center;padding:28px}.panel{width:min(860px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 18px 50px #0f172a18}.panel h1{font-size:clamp(42px,7vw,72px);margin:0 0 26px;text-align:center}.field{display:grid;gap:8px;margin-bottom:20px}.field label{font-weight:950;font-size:20px}.field input[type=text]{width:100%;padding:18px;border:2px solid #cbd5e1;border-radius:16px;font-size:30px;font-weight:950;text-transform:uppercase;text-align:center}.field input:focus{outline:3px solid #93c5fd;border-color:#2563eb}.sensitivity{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:28px;font-weight:950}.sensitivity input{width:100%}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.legend-item{border-radius:18px;color:#fff;padding:18px 8px;font-weight:950;font-size:clamp(15px,2.1vw,22px);text-align:center}.quiet{background:var(--quiet)}.talk{background:var(--talk)}.loud{background:var(--loud)}.listen{background:var(--listen)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:16px;padding:15px 22px;font-weight:950}.btn.primary{background:#0f172a;color:#fff;font-size:20px}.btn.secondary{background:#e2e8f0;color:#0f172a}.status-note{margin-top:12px;font-size:12px;color:#64748b;text-align:center}.status-note.online{color:#166534}.status-note.offline{color:#92400e}.mic-error{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:900;text-align:center}
.monitor{position:relative;overflow:hidden;color:#fff;background:var(--quiet);transition:background .25s ease}.monitor.state-quiet{background:var(--quiet)}.monitor.state-talk{background:var(--talk)}.monitor.state-loud{background:var(--loud)}.monitor.state-listen{background:var(--listen)}.monitor-inner{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px 24px 22px}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.room-label,.timer,.record-live{font-weight:950;text-shadow:0 2px 8px #0003}.room-label{font-size:clamp(22px,3vw,38px)}.timer{text-align:center;font-size:clamp(28px,3.6vw,48px);font-variant-numeric:tabular-nums}.record-live{text-align:right;font-size:clamp(17px,2.2vw,28px)}.center{display:grid;place-items:center;text-align:center;padding:30px 10px}.state-copy h2{font-size:clamp(58px,11vw,145px);line-height:.94;margin:0;text-shadow:0 6px 22px #0002;letter-spacing:-.04em}.state-copy p{font-size:clamp(26px,3.5vw,48px);font-weight:950;margin:24px 0 0}.bottom{display:grid;gap:12px}.meter-shell{height:24px;background:#ffffff45;border:2px solid #ffffff88;border-radius:999px;overflow:hidden}.meter-fill{height:100%;width:0;background:#fff;border-radius:999px;transition:width .08s linear}.teacher-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.mini{border:1px solid #ffffff80;background:#00000020;color:#fff;border-radius:12px;padding:10px 13px;font-weight:950}.point-live{font-size:clamp(16px,2vw,24px);font-weight:950}.settings{position:absolute;right:20px;bottom:82px;width:min(390px,calc(100% - 40px));background:#fff;color:#0f172a;border-radius:18px;padding:18px;box-shadow:0 16px 50px #0004;z-index:5}.settings h3{margin:0 0 12px;font-size:22px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#7f1d1d;color:#fff;z-index:20;padding:24px;text-align:center}.stop-card{width:min(850px,100%)}.stop-icon{font-size:84px}.stop-card h2{font-size:clamp(60px,11vw,135px);line-height:.9;margin:8px 0 16px}.stop-card p{font-size:clamp(30px,4vw,54px);font-weight:950;line-height:1.1;margin:0 auto 24px}.stop-card .btn{font-size:24px;background:#fff;color:#7f1d1d;padding:16px 26px}.stop-stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 22px}.pill{background:#ffffff1f;border:1px solid #ffffff55;border-radius:999px;padding:8px 13px;font-weight:900}
.summary .panel{width:min(980px,100%)}.summary h1{text-align:left;margin-bottom:12px}.result-banner{border-radius:22px;padding:22px;margin:12px 0 18px;color:#fff}.result-banner.win{background:#166534}.result-banner.no-point{background:#475569}.result-banner h2{font-size:clamp(32px,5vw,52px);margin:0 0 4px}.result-banner p{margin:0;font-size:20px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}.stat b{display:block;font-size:clamp(25px,4vw,40px);font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:#64748b;font-weight:950}
.rank-screen{padding:28px;background:#eef2f7}.rank-wrap{max-width:1100px;margin:auto}.rank-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.rank-head h1{margin:0;font-size:clamp(38px,6vw,64px)}.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rank-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.rank-card h2{margin:0 0 12px;font-size:26px}.rank-row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:13px 8px;border-top:1px solid #e2e8f0}.rank-row:first-of-type{border-top:0}.rank-pos{font-weight:950;color:#64748b}.rank-room{font-weight:950;font-size:22px}.rank-data{text-align:right;font-size:20px;font-weight:950}.hint{font-size:12px;color:#64748b}.empty{padding:22px;color:#64748b;text-align:center}
@media(max-width:760px){.legend,.rank-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.topbar{grid-template-columns:1fr auto}.record-live{grid-column:1/-1;text-align:left}.monitor-inner{padding:14px}.state-copy h2{font-size:17vw}.panel{padding:20px;border-radius:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="setup" class="screen setup">
 <div class="panel">
  <h1>🔇 Som da turma</h1>
  <div class="field"><label for="roomInput">🏫 TURMA</label><input id="roomInput" type="text" list="rooms" maxlength="12" placeholder="4A" autocomplete="off"><datalist id="rooms"><option>1A</option><option>1B</option><option>1C</option><option>1D</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>3C</option><option>4A</option><option>4B</option><option>4C</option><option>4D</option><option>5A</option><option>5B</option><option>5C</option></datalist></div>
  <div class="field"><label for="sensitivity">🎙️ MICROFONE</label><div class="sensitivity"><span>−</span><input id="sensitivity" type="range" min="0" max="100" value="55"><span>+</span></div></div>
  <div class="legend"><div class="legend-item quiet">🤫 SILÊNCIO</div><div class="legend-item talk">💬 CONVERSA</div><div class="legend-item loud">🔊 MUITO ALTO</div><div class="legend-item listen">👂 OUVIR</div></div>
  <div id="micError" class="mic-error hidden"></div>
  <div class="actions"><button id="startBtn" class="btn primary">▶ COMEÇAR</button><button id="rankingBtn" class="btn secondary">🏆 RANKING</button></div><div id="dbStatus" class="status-note">● ...</div>
 </div>
</section>

<section id="monitor" class="screen monitor state-quiet hidden" aria-live="polite">
 <div class="monitor-inner">
  <div class="topbar"><div id="roomLabel" class="room-label">Turma</div><div id="timer" class="timer">00:00</div><div class="record-live">🤫 RECORDE <span id="liveRecord">00:00</span></div></div>
  <div class="center"><div class="state-copy"><h2 id="stateTitle">🤫 SILÊNCIO</h2><p id="stateSubtitle">MUITO BEM!</p></div></div>
  <div class="bottom"><div class="meter-shell"><div id="meterFill" class="meter-fill"></div></div><div class="teacher-tools"><div id="pointLive" class="point-live">⭐ PONTO VALENDO</div><div><button id="pauseBtn" class="mini">⏸ PAUSAR</button> <button id="settingsBtn" class="mini">⚙️</button> <button id="finishBtn" class="mini">⏹ ENCERRAR</button></div></div></div>
 </div>
 <div id="settingsPanel" class="settings hidden"><h3>⚙️ MICROFONE</h3><div class="field"><label for="sensitivityLive">Sensibilidade</label><div class="sensitivity"><span>−</span><input id="sensitivityLive" type="range" min="0" max="100" value="55"><span>+</span></div></div><div class="actions"><button id="closeSettingsBtn" class="btn secondary">FECHAR</button></div></div>
</section>

<div id="stopOverlay" class="overlay hidden"><div class="stop-card"><div class="stop-icon">⛔</div><h2>AULA PARADA</h2><p>MUITO BARULHO!</p><div class="stop-stats"><span class="pill">🏫 <b id="stopRoom"></b></span><span class="pill">⛔ <b id="stopCount">1</b></span></div><button id="releaseBtn" class="btn">▶ CONTINUAR</button><div style="margin-top:12px"><button id="finishBlockedBtn" class="mini">⏹ ENCERRAR</button></div></div></div>

<section id="summary" class="screen summary hidden"><div class="panel"><h1 id="summaryRoom">Turma</h1><div id="resultBanner" class="result-banner"><h2 id="resultTitle"></h2><p id="resultText"></p></div><div class="stats"><div class="stat"><b id="summaryRecord">00:00</b><span>🤫 RECORDE</span></div><div class="stat"><b id="summaryQuiet">0%</b><span>🟢 SILÊNCIO</span></div><div class="stat"><b id="summaryStops">0</b><span>⛔ PARADAS</span></div><div class="stat"><b id="summaryDuration">00:00</b><span>⏱️ TEMPO</span></div></div><div class="actions"><button id="newBtn" class="btn primary">▶ NOVA AULA</button><button id="summaryRankingBtn" class="btn secondary">🏆 RANKING</button></div><div id="saveStatus" class="status-note"></div></div></section>

<section id="ranking" class="screen rank-screen hidden"><div class="rank-wrap"><div class="rank-head"><h1>🏆 RANKING</h1><button id="backBtn" class="btn secondary">← VOLTAR</button></div><div class="rank-grid"><div class="rank-card"><h2>⭐ PONTOS</h2><div id="pointsRanking"></div></div><div class="rank-card"><h2>🤫 RECORDES</h2><div id="recordRanking"></div></div></div><div id="rankStatus" class="status-note"></div></div></section>

<script>
const SUPABASE_URL='https://eyfmhnlzduoobdmwexmc.supabase.co',SUPABASE_KEY='sb_publishable_as-eMTlem4cWd29PVNFAhg_uVLIqZKu',SUPABASE_TABLE='invencoes_ranking',LOCAL_KEY='led_noise_sessions_v1',PREFIX='R|';
const els={setup:document.getElementById('setup'),monitor:document.getElementById('monitor'),summary:document.getElementById('summary'),ranking:document.getElementById('ranking')};
let stream=null,audioCtx=null,analyser=null,dataArray=null,raf=0,active=false,blocked=false,paused=false;
let room='',startAt=0,lastFrame=0,smoothed=0,currentState='quiet',nonQuietSince=0,loudSince=0,unlockGraceUntil=0;
let quietMs=0,measuredMs=0,quietStreakStart=0,maxQuietMs=0,stops=0,pointEligible=true,sensitivity=55;
function show(id){Object.entries(els).forEach(([k,v])=>v.classList.toggle('hidden',k!==id))}
function fmt(ms){const sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),s=sec%60;return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function sanitizeRoom(v){return String(v||'').trim().toUpperCase().replace(/\|/g,'').replace(/\s+/g,' ').slice(0,12)}
function sessionId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function localSessions(){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function writeLocal(rows){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(rows.slice(-500)))}catch(e){}}
function thresholds(){const f=1.7-(sensitivity/100)*1.12;return{quiet:.028*f,loud:.082*f}}
function setSensitivity(v){sensitivity=Number(v);document.getElementById('sensitivity').value=sensitivity;document.getElementById('sensitivityLive').value=sensitivity}
function endQuietStreak(now=performance.now()){if(quietStreakStart){maxQuietMs=Math.max(maxQuietMs,now-quietStreakStart);quietStreakStart=0}}
function paint(state){const m=els.monitor,title=document.getElementById('stateTitle'),sub=document.getElementById('stateSubtitle');m.classList.remove('state-quiet','state-talk','state-loud','state-listen');m.classList.add('state-'+state);if(state==='quiet'){title.textContent='🤫 SILÊNCIO';sub.textContent='MUITO BEM!'}if(state==='talk'){title.textContent='💬 CONVERSA';sub.textContent='MAIS BAIXO'}if(state==='loud'){title.textContent='🔊 MUITO ALTO';sub.textContent='ABAIXE O SOM!'}if(state==='listen'){title.textContent='👂 OUVIR';sub.textContent='FIQUE ATENTO'}}
function setState(state,now=performance.now()){if(currentState===state)return;if(currentState==='quiet')endQuietStreak(now);currentState=state;paint(state);if(state==='quiet'){quietStreakStart=now;nonQuietSince=0}if(state==='talk'||state==='loud'){if(!nonQuietSince)nonQuietSince=now}}
function updatePoint(now){if(pointEligible&&nonQuietSince&&now-nonQuietSince>2000){pointEligible=false;document.getElementById('pointLive').textContent='❌ SEM PONTO'}}
function levelPercent(){const t=thresholds();return Math.min(100,Math.max(1,(smoothed/(t.loud*1.45))*100))}
function beep(){try{if(!audioCtx)return;audioCtx.resume?.();const now=audioCtx.currentTime;[0,.18].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=i?520:760;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(.15,now+d+.015);g.gain.exponentialRampToValueAtTime(.0001,now+d+.14);o.start(now+d);o.stop(now+d+.16)})}catch(e){}}
function triggerStop(){if(blocked||paused)return;blocked=true;stops++;pointEligible=false;endQuietStreak();beep();document.getElementById('pointLive').textContent='❌ SEM PONTO';document.getElementById('stopRoom').textContent=room;document.getElementById('stopCount').textContent=stops;document.getElementById('stopOverlay').classList.remove('hidden')}
function releaseStop(){document.getElementById('stopOverlay').classList.add('hidden');blocked=false;loudSince=0;nonQuietSince=0;unlockGraceUntil=performance.now()+1800;currentState='quiet';quietStreakStart=performance.now();paint('quiet')}
function togglePause(){if(!active||blocked)return;const now=performance.now();paused=!paused;document.getElementById('settingsPanel').classList.add('hidden');if(paused){endQuietStreak(now);nonQuietSince=0;loudSince=0;currentState='listen';paint('listen');document.getElementById('pauseBtn').textContent='▶ VOLTAR';document.getElementById('meterFill').style.width='0%'}else{unlockGraceUntil=now+1500;nonQuietSince=0;loudSince=0;smoothed=0;currentState='quiet';quietStreakStart=now;paint('quiet');document.getElementById('pauseBtn').textContent='⏸ PAUSAR'}}
function loop(now){if(!active)return;raf=requestAnimationFrame(loop);document.getElementById('timer').textContent=fmt(now-startAt);const delta=Math.min(100,Math.max(0,now-lastFrame));lastFrame=now;if(blocked||paused)return;measuredMs+=delta;analyser.getByteTimeDomainData(dataArray);let sum=0;for(let i=0;i<dataArray.length;i++){const x=(dataArray[i]-128)/128;sum+=x*x}smoothed=smoothed*.82+Math.sqrt(sum/dataArray.length)*.18;const t=thresholds(),state=smoothed<t.quiet?'quiet':smoothed<t.loud?'talk':'loud';setState(state,now);document.getElementById('meterFill').style.width=levelPercent()+'%';if(state==='quiet'){quietMs+=delta;if(!quietStreakStart)quietStreakStart=now;maxQuietMs=Math.max(maxQuietMs,now-quietStreakStart);loudSince=0}else if(state==='loud'){if(!loudSince)loudSince=now;if(now>unlockGraceUntil&&now-loudSince>900)triggerStop()}else loudSince=0;updatePoint(now);document.getElementById('liveRecord').textContent=fmt(maxQuietMs)}
async function startLesson(){const input=sanitizeRoom(document.getElementById('roomInput').value),err=document.getElementById('micError');err.classList.add('hidden');if(!input){err.textContent='🏫 ESCOLHA A TURMA';err.classList.remove('hidden');return}room=input;setSensitivity(document.getElementById('sensitivity').value);try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const C=window.AudioContext||window.webkitAudioContext;audioCtx=new C();await audioCtx.resume();const source=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.15;source.connect(analyser);dataArray=new Uint8Array(analyser.fftSize)}catch(e){err.textContent='🎙️ LIBERE O MICROFONE E TENTE DE NOVO';err.classList.remove('hidden');if(document.fullscreenElement)document.exitFullscreen?.();return}active=true;blocked=false;paused=false;stops=0;pointEligible=true;quietMs=0;measuredMs=0;maxQuietMs=0;smoothed=0;nonQuietSince=0;loudSince=0;unlockGraceUntil=0;currentState='quiet';startAt=performance.now();lastFrame=startAt;quietStreakStart=startAt;document.getElementById('roomLabel').textContent='🏫 '+room;document.getElementById('pointLive').textContent='⭐ PONTO VALENDO';document.getElementById('pauseBtn').textContent='⏸ PAUSAR';document.getElementById('liveRecord').textContent='00:00';document.getElementById('meterFill').style.width='0%';paint('quiet');show('monitor');raf=requestAnimationFrame(loop)}
function stopAudio(){active=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioCtx){audioCtx.close?.();audioCtx=null}}
async function finishLesson(){if(!active)return;const now=performance.now();if(!paused&&!blocked&&currentState==='quiet')endQuietStreak(now);const duration=now-startAt;stopAudio();document.getElementById('stopOverlay').classList.add('hidden');blocked=false;paused=false;if(document.fullscreenElement)document.exitFullscreen?.();const record=Math.round(maxQuietMs/1000),quietPct=measuredMs?Math.min(100,Math.round(quietMs/measuredMs*100)):0,point=pointEligible?1:0,s={id:sessionId(),room,point,record,duration:Math.round(duration/1000),quietPct,stops,ts:Date.now(),synced:false};const rows=localSessions();rows.push(s);writeLocal(rows);document.getElementById('summaryRoom').textContent='🏫 '+room;const banner=document.getElementById('resultBanner');banner.className='result-banner '+(point?'win':'no-point');document.getElementById('resultTitle').textContent=point?'⭐ +1 PONTO!':'FIM DA AULA';document.getElementById('resultText').textContent=point?'PARABÉNS, TURMA!':'VAMOS TENTAR DE NOVO!';document.getElementById('summaryRecord').textContent=fmt(record*1000);document.getElementById('summaryQuiet').textContent=quietPct+'%';document.getElementById('summaryStops').textContent=stops;document.getElementById('summaryDuration').textContent=fmt(duration);show('summary');document.getElementById('saveStatus').textContent='SALVANDO...';try{await saveOnline(s);markSynced(s.id);document.getElementById('saveStatus').textContent='✅ SALVO';document.getElementById('saveStatus').className='status-note online'}catch(e){document.getElementById('saveStatus').textContent='💾 SALVO NESTE COMPUTADOR';document.getElementById('saveStatus').className='status-note offline'}}
function encodedName(s){return`${PREFIX}${s.room}|${s.point}|${Math.max(0,Math.floor(s.record))}|${String(s.id).slice(-8)}`}
async function saveOnline(s){const r=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({nome:encodedName(s),pontos:s.point})});if(!r.ok)throw new Error('save '+r.status)}
function markSynced(id){const rows=localSessions(),x=rows.find(s=>s.id===id);if(x){x.synced=true;writeLocal(rows)}}
async function syncPending(){for(const s of localSessions().filter(x=>!x.synced)){try{await saveOnline(s);markSynced(s.id)}catch(e){break}}}
async function onlineSessions(){const q=new URLSearchParams({select:'nome,pontos,criado_em',nome:'like.R|*',order:'criado_em.desc',limit:'2000'}),r=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?${q}`,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw new Error('load '+r.status);return(await r.json()).map(row=>{const p=String(row.nome||'').split('|');return p[0]==='R'&&p.length>=4?{room:sanitizeRoom(p[1]),point:Number(p[2])===1?1:0,record:Number(p[3])||0,ts:row.criado_em||0}:null}).filter(Boolean)}
function aggregate(rows){const map=new Map();for(const s of rows){if(!s.room)continue;const k=s.room.toUpperCase(),x=map.get(k)||{room:k,points:0,record:0,lessons:0};x.points+=Number(s.point)||0;x.record=Math.max(x.record,Number(s.record)||0);x.lessons++;map.set(k,x)}return[...map.values()]}
function drawRows(id,rows,mode){const box=document.getElementById(id);box.innerHTML='';if(!rows.length){box.innerHTML='<div class="empty">SEM RESULTADOS</div>';return}rows.forEach((x,i)=>{const r=document.createElement('div');r.className='rank-row';r.innerHTML=`<div class="rank-pos">${i+1}º</div><div class="rank-room">${x.room}<div class="hint">${x.lessons} aula${x.lessons===1?'':'s'}</div></div><div class="rank-data">${mode==='points'?`${x.points} ⭐`:fmt(x.record*1000)}</div>`;box.appendChild(r)})}
async function renderRanking(){show('ranking');const status=document.getElementById('rankStatus');status.textContent='...';let rows;try{await syncPending();rows=await onlineSessions();status.textContent='● ONLINE';status.className='status-note online'}catch(e){rows=localSessions();status.textContent='● NESTE COMPUTADOR';status.className='status-note offline'}const agg=aggregate(rows),points=[...agg].sort((a,b)=>b.points-a.points||b.record-a.record||a.room.localeCompare(b.room,'pt-BR')),records=[...agg].sort((a,b)=>b.record-a.record||b.points-a.points||a.room.localeCompare(b.room,'pt-BR'));drawRows('pointsRanking',points,'points');drawRows('recordRanking',records,'record')}
async function checkOnline(){const s=document.getElementById('dbStatus');try{const q=new URLSearchParams({select:'nome',limit:'1'}),r=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?${q}`,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw 0;s.textContent='● ONLINE';s.className='status-note online';syncPending()}catch(e){s.textContent='● NESTE COMPUTADOR';s.className='status-note offline'}}
document.getElementById('startBtn').onclick=startLesson;document.getElementById('rankingBtn').onclick=renderRanking;document.getElementById('summaryRankingBtn').onclick=renderRanking;document.getElementById('backBtn').onclick=()=>show('setup');document.getElementById('newBtn').onclick=()=>{document.getElementById('roomInput').value=room;show('setup')};document.getElementById('pauseBtn').onclick=togglePause;document.getElementById('finishBtn').onclick=finishLesson;document.getElementById('finishBlockedBtn').onclick=finishLesson;document.getElementById('releaseBtn').onclick=releaseStop;document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsPanel').classList.toggle('hidden');document.getElementById('closeSettingsBtn').onclick=()=>document.getElementById('settingsPanel').classList.add('hidden');document.getElementById('sensitivity').oninput=e=>setSensitivity(e.target.value);document.getElementById('sensitivityLive').oninput=e=>setSensitivity(e.target.value);document.getElementById('roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')startLesson()});window.addEventListener('beforeunload',e=>{if(active){e.preventDefault();e.returnValue=''}});checkOnline();
</script>
<script src="control-sync.js"></script>
