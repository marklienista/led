name: Diagnostico Supabase Som da Turma
on:
  push:
    paths:
      - '.github/workflows/diagnostico-supabase.yml'
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar esquema Supabase
        shell: bash
        run: |
          set +e
          URL=$(grep -o "SUPABASE_URL='[^']*'" barulho/index.html | head -1 | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_KEY='[^']*'" barulho/index.html | head -1 | cut -d"'" -f2)
          curl -sS "$URL/rest/v1/" -H "apikey: $KEY" -H "Accept: application/openapi+json" -o /tmp/schema.json
          python -c "import json; d=json.load(open('/tmp/schema.json')); print('TABLES='+','.join(sorted(d.get('definitions',{}).keys())))"
